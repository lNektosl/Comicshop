services:
  db:
    image: postgres:15
    container_name: comicshop-db
    environment:
      POSTGRES_DB: Comic_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/SQL:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    container_name: comicshop-adminer
    restart: always
    ports:
      - "8081:8080"

  app:
    build: .
    container_name: comicshop-app
    ports:
      - "8080:8080"
    depends_on:
      - db